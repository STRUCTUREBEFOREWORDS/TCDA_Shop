    <script type="application/ld+json" data-rh="true">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"¿Cuánto tarda el envío?","acceptedAnswer":{"@type":"Answer","text":"Los pedidos se envían en un plazo de 2 a 7 días hábiles tras la compra, con entrega habitual en 5 a 15 días hábiles."}},{"@type":"Question","name":"¿Se aceptan devoluciones o cambios?","acceptedAnswer":{"@type":"Answer","text":"Aceptamos devoluciones de productos defectuosos dentro de los 14 días."}},{"@type":"Question","name":"¿Qué hago si estoy entre dos tallas?","acceptedAnswer":{"@type":"Answer","text":"Para un ajuste más holgado, recomendamos la talla superior. El modelo mide 180 cm y viste talla M."}},{"@type":"Question","name":"¿Cómo elijo la talla correcta?","acceptedAnswer":{"@type":"Answer","text":"Consulta la guía de tallas para ver las medidas del producto. Si dudas entre dos tallas, elige la más grande."}},{"@type":"Question","name":"¿Cómo consigo un look oversize?","acceptedAnswer":{"@type":"Answer","text":"Elige una talla más de lo habitual. La silueta varía según el producto — revisa la información de corte en la página del producto."}},{"@type":"Question","name":"¿Qué talla lleva el modelo?","acceptedAnswer":{"@type":"Answer","text":"La altura y la talla del modelo se indican en cada página de producto. Nota: se utilizan imágenes de modelo generadas por IA."}},{"@type":"Question","name":"¿Cuánto tarda el envío?","acceptedAnswer":{"@type":"Answer","text":"Los pedidos se procesan en 2–7 días hábiles y suelen llegar en 5–15 días hábiles adicionales tras el envío. Se envía un número de seguimiento tras el despacho."}},{"@type":"Question","name":"¿Se realiza envío internacional?","acceptedAnswer":{"@type":"Answer","text":"Los artículos se envían desde un socio de producción en el extranjero. El estado puede rastrearse con el número proporcionado."}},{"@type":"Question","name":"¿Aceptáis devoluciones o cambios?","acceptedAnswer":{"@type":"Answer","text":"Aceptamos devoluciones solo por artículos dañados, con defectos de impresión o envíos incorrectos. No se aceptan devoluciones por talla o preferencia personal."}},{"@type":"Question","name":"¿Qué hago si mi artículo tiene un defecto?","acceptedAnswer":{"@type":"Answer","text":"Contáctanos en info@tcdashop.com en un plazo de 14 días desde la recepción. Gestionaremos un reenvío o reembolso tras la verificación. No obstante, los consumidores de la UE/Reino Unido disponen de un derecho legal de desistimiento de 14 días desde la entrega; los gastos de devolución corren a cargo del cliente."}},{"@type":"Question","name":"¿El color coincidirá con lo que veo en pantalla?","acceptedAnswer":{"@type":"Answer","text":"Los colores pueden variar ligeramente según la configuración de tu monitor y las condiciones de iluminación."}},{"@type":"Question","name":"¿Se puede lavar?","acceptedAnswer":{"@type":"Answer","text":"Se puede lavar a máquina. Para mayor durabilidad, recomendamos lavar del revés."}},{"@type":"Question","name":"¿Qué métodos de pago se aceptan?","acceptedAnswer":{"@type":"Answer","text":"Solo aceptamos tarjetas de crédito (Visa, Mastercard, JCB, American Express, Diners Club)."}}]}</script>
