    <script type="application/ld+json" data-rh="true">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Quel est le délai de livraison ?","acceptedAnswer":{"@type":"Answer","text":"Vos commandes sont expédiées sous 2 à 7 jours ouvrés, puis livrées sous 5 à 15 jours ouvrés en règle générale."}},{"@type":"Question","name":"Les retours et échanges sont-ils possibles ?","acceptedAnswer":{"@type":"Answer","text":"Les articles défectueux peuvent être retournés dans les 14 jours suivant la réception."}},{"@type":"Question","name":"Que faire si je me situe entre deux tailles ?","acceptedAnswer":{"@type":"Answer","text":"Pour un port décontracté, nous recommandons la taille supérieure. Le modèle mesure 180 cm et porte une taille M."}},{"@type":"Question","name":"Je ne sais pas quelle taille choisir.","acceptedAnswer":{"@type":"Answer","text":"Consultez le guide des tailles pour les dimensions du vêtement. En cas de doute entre deux tailles, prenez la plus grande."}},{"@type":"Question","name":"Comment obtenir un look oversize ?","acceptedAnswer":{"@type":"Answer","text":"Choisissez une taille au-dessus de votre taille habituelle. La silhouette varie selon les produits — consultez les informations de coupe sur la page produit."}},{"@type":"Question","name":"Quelle taille porte le modèle ?","acceptedAnswer":{"@type":"Answer","text":"La taille et la pointure du modèle sont indiquées sur chaque page produit. Note : des visuels de modèles générés par IA sont utilisés."}},{"@type":"Question","name":"Quel est le délai de livraison ?","acceptedAnswer":{"@type":"Answer","text":"Les commandes sont traitées sous 2 à 7 jours ouvrés, puis livrées sous 5 à 15 jours ouvrés après expédition. Un numéro de suivi est envoyé après l'expédition."}},{"@type":"Question","name":"La livraison est-elle internationale ?","acceptedAnswer":{"@type":"Answer","text":"Les articles sont expédiés depuis un partenaire de production à l'étranger. Le statut peut être suivi avec le numéro fourni."}},{"@type":"Question","name":"Les retours ou échanges sont-ils possibles ?","acceptedAnswer":{"@type":"Answer","text":"Nous acceptons les retours uniquement en cas de produit endommagé, d'impression défectueuse ou d'envoi incorrect. Les retours pour raison de taille ou de préférence personnelle ne sont pas acceptés."}},{"@type":"Question","name":"Que faire si mon article est défectueux ?","acceptedAnswer":{"@type":"Answer","text":"Contactez-nous à info@tcdashop.com dans les 14 jours suivant la réception. Nous procéderons à un renvoi ou un remboursement après vérification. Toutefois, les consommateurs de l'UE/du Royaume-Uni disposent d'un droit légal de rétractation de 14 jours à compter de la livraison ; les frais de retour sont à la charge du client."}},{"@type":"Question","name":"La couleur sera-t-elle identique à l'écran ?","acceptedAnswer":{"@type":"Answer","text":"Les couleurs peuvent légèrement varier selon les paramètres de votre écran et les conditions d'éclairage."}},{"@type":"Question","name":"Le lavage est-il possible ?","acceptedAnswer":{"@type":"Answer","text":"Le lavage en machine est possible. Pour une meilleure durabilité, nous recommandons de laver à l'envers."}},{"@type":"Question","name":"Quels modes de paiement sont acceptés ?","acceptedAnswer":{"@type":"Answer","text":"Seules les cartes bancaires sont acceptées (Visa, Mastercard, JCB, American Express, Diners Club)."}}]}</script>
