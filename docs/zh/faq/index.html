    <script type="application/ld+json" data-rh="true">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"配送需要多长时间？","acceptedAnswer":{"@type":"Answer","text":"下单后2至7个工作日内发货，通常于5至15个工作日内送达。"}},{"@type":"Question","name":"可以退货或换货吗？","acceptedAnswer":{"@type":"Answer","text":"商品存在质量问题时，我们接受14天内的退货申请。"}},{"@type":"Question","name":"如果我的尺码介于两者之间，该怎么选？","acceptedAnswer":{"@type":"Answer","text":"若偏好宽松的穿着感，建议选择较大尺码。模特身高180cm，穿着M码。"}},{"@type":"Question","name":"不确定如何选择尺码？","acceptedAnswer":{"@type":"Answer","text":"请参考尺码指南中的商品实际尺寸。若介于两个尺码之间，建议选大一码。"}},{"@type":"Question","name":"如何穿出宽松感？","acceptedAnswer":{"@type":"Answer","text":"请比平时大一码选购。不同商品的廓形有所不同，详情请参考商品页面上的版型信息。"}},{"@type":"Question","name":"模特穿什么尺码？","acceptedAnswer":{"@type":"Answer","text":"每件商品页面均注明了模特的身高及着装尺码。注：本品使用AI生成模特图像。"}},{"@type":"Question","name":"下单后多久能收到？","acceptedAnswer":{"@type":"Answer","text":"订单将在下单后2–7个工作日内处理，发货后通常5–15个工作日内送达。发货后将向您发送快递追踪单号。"}},{"@type":"Question","name":"是海外发货吗？","acceptedAnswer":{"@type":"Answer","text":"商品由海外合作工厂发出。您可使用提供的追踪单号查询配送状态。"}},{"@type":"Question","name":"是否支持退换货？","acceptedAnswer":{"@type":"Answer","text":"仅受理商品破损、印刷不良或错发商品的退货申请。因尺码或个人偏好原因不予退换。"}},{"@type":"Question","name":"收到有瑕疵的商品怎么办？","acceptedAnswer":{"@type":"Answer","text":"请在收货后14天内联系info@tcdashop.com，核实后将为您安排补发或退款。但欧盟/英国消费者自收货之日起享有14天的法定撤回权，退货运费由客户承担。"}},{"@type":"Question","name":"实物颜色与屏幕显示一致吗？","acceptedAnswer":{"@type":"Answer","text":"受显示器设置及光线条件影响，实物颜色可能与屏幕显示略有偏差。"}},{"@type":"Question","name":"可以水洗吗？","acceptedAnswer":{"@type":"Answer","text":"可机洗。为延长使用寿命，建议翻面洗涤。"}},{"@type":"Question","name":"支持哪些支付方式？","acceptedAnswer":{"@type":"Answer","text":"仅支持信用卡付款（Visa / Mastercard / JCB / American Express / Diners Club）。"}}]}</script>
