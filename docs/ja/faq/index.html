    <script type="application/ld+json" data-rh="true">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"配送にどのくらいかかりますか？","acceptedAnswer":{"@type":"Answer","text":"ご注文後2〜7営業日以内に発送し、通常5〜15営業日でお届けします。"}},{"@type":"Question","name":"返品・交換はできますか？","acceptedAnswer":{"@type":"Answer","text":"不良品の場合は14日以内に返品を受け付けます。"}},{"@type":"Question","name":"サイズの間にいる場合はどうすればいいですか？","acceptedAnswer":{"@type":"Answer","text":"ゆったり着たい場合は上のサイズをおすすめします。モデルは身長180cmでMサイズを着用しています。"}},{"@type":"Question","name":"サイズ選びで迷った場合は？","acceptedAnswer":{"@type":"Answer","text":"サイズガイドに商品の寸法を掲載しています。2つのサイズで迷った場合は上のサイズをお選びください。"}},{"@type":"Question","name":"オーバーサイズで着たい場合は？","acceptedAnswer":{"@type":"Answer","text":"通常より1サイズ上をお選びください。シルエットは商品によって異なるため、商品ページのフィット情報をご確認ください。"}},{"@type":"Question","name":"モデルの着用サイズは？","acceptedAnswer":{"@type":"Answer","text":"各商品ページに「身長 / 着用サイズ」を記載しています。※AIモデルを使用しています。"}},{"@type":"Question","name":"注文してからどのくらいで届きますか？","acceptedAnswer":{"@type":"Answer","text":"ご注文後2〜7営業日で発送し、その後通常5〜15営業日でお届けします。発送後は追跡番号をお送りします。"}},{"@type":"Question","name":"海外発送ですか？","acceptedAnswer":{"@type":"Answer","text":"海外提携工場から発送されます。配送状況は追跡番号から確認可能です。"}},{"@type":"Question","name":"返品・交換は可能ですか？","acceptedAnswer":{"@type":"Answer","text":"商品の破損・印刷不良・誤配送の場合のみ対応しています。サイズ違い・イメージ違いによる返品・交換は受け付けていません。"}},{"@type":"Question","name":"商品に不備があった場合は？","acceptedAnswer":{"@type":"Answer","text":"商品到着後14日以内にinfo@tcdashop.comへご連絡ください。確認後、再送または返金にて対応いたします。ただし、EU・英国の消費者の方には、商品の到着後14日間の法定撤回権があり、返送料はお客様負担となります。"}},{"@type":"Question","name":"商品の色味は実物と同じですか？","acceptedAnswer":{"@type":"Answer","text":"モニター環境や照明により、実物と多少異なる場合があります。"}},{"@type":"Question","name":"洗濯は可能ですか？","acceptedAnswer":{"@type":"Answer","text":"通常洗濯可能です。長くご着用いただくために、裏返して洗濯することを推奨しています。"}},{"@type":"Question","name":"支払い方法は何がありますか？","acceptedAnswer":{"@type":"Answer","text":"クレジットカード（Visa / Mastercard / JCB / American Express / Diners Club）のみご利用いただけます。"}}]}</script>
